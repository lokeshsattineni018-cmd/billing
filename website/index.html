<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b5394" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VIJAYA DURGA AGENCIES" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="VIJAYA DURGA AGENCIES — Seafood Billing & Invoicing System" />

    <!-- DNS prefetch for API and font CDNs -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts with display=swap (non-blocking) — includes Telugu font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+Telugu:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>VIJAYA DURGA AGENCIES — Billing System</title>

    <!-- Critical inline CSS: instant feedback before main CSS loads -->
    <style>
      body { margin: 0; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      #root { min-height: 100vh; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .app-initial-loader {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; width: 100%; background: #f8fafc;
      }
      .app-initial-loader > div {
        width: 40px; height: 40px; border: 3px solid #e2e8f0;
        border-top-color: #0b5394; border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
    </style>

    <script>
      // Production defense-in-depth: Disable React DevTools and silence runtime console
      if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
          isDisabled: true,
          supportsFiber: true,
          inject: function () {},
          onCommitFiberRoot: function () {},
          onCommitFiberUnmount: function () {}
        };
        ['log', 'debug', 'info', 'warn', 'error', 'table', 'trace'].forEach(function (method) {
          console[method] = function () {};
        });
      }

      // Defensive guard against noisy third-party browser extension errors
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.includes('startTime') || (e.filename && e.filename.includes('anonymous')))) {
          e.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <!-- Instant loading indicator before React hydrates -->
    <div id="root"><div class="app-initial-loader"><div></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
